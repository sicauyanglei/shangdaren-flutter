<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>回放页面预览</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0d3d1a; font-family: 'Microsoft YaHei', sans-serif; color: #fff; overflow: hidden; }

.replay-container {
  width: 100vw; height: 100vh; position: relative;
  background: radial-gradient(ellipse at center, #1a5c2e 0%, #0d3d1a 50%, #062810 100%);
}

.player-area {
  position: absolute; padding: 4px; border-radius: 6px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  overflow: hidden;
}
.player-area.main-view {
  background: rgba(26,42,58,0.6);
  border-color: rgba(255,215,0,0.3);
}

.player-left { top: 4px; left: 4px; width: 27%; height: 55%; }
.player-right { top: 4px; right: 4px; width: 27%; height: 55%; }
.player-bottom { bottom: 50px; left: 4px; right: 4px; height: 38%; }

.player-header {
  display: flex; align-items: center; gap: 4px; margin-bottom: 2px; flex-wrap: wrap;
}
.player-name { font-size: 11px; color: #aaa; font-weight: bold; }
.main-view .player-name { color: #ffd700; }
.dealer-badge {
  font-size: 8px; color: #f44; background: rgba(255,68,68,0.3);
  padding: 1px 3px; border-radius: 3px;
}
.piao-badge { font-size: 8px; color: #4ecdc4; }
.hand-count { font-size: 8px; color: rgba(255,255,255,0.4); }

/* 组合牌区 */
.melds-row { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 2px; }
.meld-group { display: flex; gap: 1px; }

/* 手牌 - 主视角(底部) */
.hand-main { display: flex; flex-wrap: wrap; gap: 1px; margin-bottom: 2px; }
.card-main {
  width: 28px; height: 60px; background: #fff; border-radius: 3px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: bold; border: 1.5px solid;
}
.card-main.red { color: #c00; border-color: #f44; }
.card-main.green { color: #060; border-color: #3b3; }
.card-main.black { color: #333; border-color: #666; }

/* 手牌 - AI(层叠) */
.hand-folded { display: flex; flex-wrap: wrap; gap: 2px; margin-bottom: 2px; }
.fold-group { display: flex; gap: 1px; }
.card-fold {
  width: 22px; height: 36px; background: #fff; border-radius: 2px;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: bold; border: 1px solid;
}
.card-fold.red { color: #c00; border-color: #f44; }
.card-fold.green { color: #060; border-color: #3b3; }
.card-fold.black { color: #333; border-color: #666; }

/* 弃牌区 */
.discards-row { display: flex; flex-wrap: wrap; gap: 1px; }
.card-discard {
  width: 20px; height: 32px; background: rgba(255,255,255,0.8); border-radius: 2px;
  display: flex; align-items: center; justify-content: center;
  font-size: 8px; font-weight: bold; border: 0.5px solid;
}
.card-discard.red { color: #c00; border-color: rgba(255,68,68,0.6); }
.card-discard.green { color: #060; border-color: rgba(51,187,51,0.6); }
.card-discard.black { color: #333; border-color: rgba(102,102,102,0.6); }

/* 中间区域 */
.center-area {
  position: absolute; top: 4px; left: calc(27% + 8px); right: calc(27% + 8px); height: 55%;
  display: flex; align-items: center; justify-content: center;
}
.status-text { font-size: 13px; color: rgba(255,255,255,0.7); }

/* 控制栏 - 右下角两排 */
.controls {
  position: absolute; bottom: 4px; right: 8px;
  display: flex; flex-direction: column; align-items: flex-end; gap: 4px;
}
.ctrl-row { display: flex; align-items: center; gap: 3px; }

.ctrl-btn {
  padding: 5px 12px; border-radius: 6px; cursor: pointer;
  display: flex; align-items: center; gap: 2px;
  font-size: 10px; border: 1px solid;
}
.ctrl-btn.play { background: rgba(78,205,196,0.2); border-color: rgba(78,205,196,0.5); color: #4ecdc4; }
.ctrl-btn.stop { background: rgba(255,68,68,0.2); border-color: rgba(255,68,68,0.5); color: #f44; }

.speed-btn {
  padding: 4px 8px; border-radius: 6px; cursor: pointer;
  font-size: 10px; border: 1px solid;
  background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.5);
}
.speed-btn.active { background: rgba(255,215,0,0.3); border-color: #ffd700; color: #ffd700; font-weight: bold; }

.view-btn {
  padding: 4px 8px; border-radius: 6px; cursor: pointer;
  font-size: 10px; border: 1px solid;
  background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.5);
}
.view-btn.active { background: rgba(255,215,0,0.3); border-color: #ffd700; color: #ffd700; font-weight: bold; }

.badge {
  padding: 3px 6px; border-radius: 3px; font-size: 9px; font-weight: bold;
}
.badge-round { background: rgba(78,205,196,0.25); border: 1px solid rgba(78,205,196,0.6); color: #4ecdc4; }
.badge-replay { background: rgba(255,68,68,0.25); border: 1px solid rgba(255,68,68,0.6); color: #f66; }

/* 组合牌小卡 */
.card-meld {
  width: 22px; height: 36px; background: #fff; border-radius: 2px;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: bold; border: 1px solid;
}
.card-meld.red { color: #c00; border-color: #f44; }
.card-meld.green { color: #060; border-color: #3b3; }
.card-meld.black { color: #333; border-color: #666; }
</style>
</head>
<body>
<div class="replay-container">

  <!-- 左上 - 玩家0 -->
  <div class="player-area player-left">
    <div class="player-header">
      <span class="player-name">玩家1</span>
      <span class="dealer-badge">庄</span>
      <span class="piao-badge">飘2</span>
      <span class="hand-count">手牌14</span>
    </div>
    <div class="melds-row">
      <div class="meld-group">
        <div class="card-meld red">上</div>
        <div class="card-meld red">大</div>
        <div class="card-meld red">人</div>
      </div>
      <div class="meld-group">
        <div class="card-meld green">七</div>
        <div class="card-meld green">十</div>
        <div class="card-meld green">土</div>
      </div>
    </div>
    <div class="hand-folded">
      <div class="fold-group">
        <div class="card-fold red">大</div>
        <div class="card-fold red">人</div>
      </div>
      <div class="fold-group">
        <div class="card-fold green">三</div>
        <div class="card-fold green">千</div>
      </div>
      <div class="fold-group">
        <div class="card-fold black">丘</div>
        <div class="card-fold black">己</div>
      </div>
    </div>
    <div class="discards-row">
      <div class="card-discard black">己</div>
      <div class="card-discard green">土</div>
      <div class="card-discard black">小</div>
      <div class="card-discard black">九</div>
    </div>
  </div>

  <!-- 右上 - 玩家2 -->
  <div class="player-area player-right">
    <div class="player-header" style="justify-content: flex-end;">
      <span class="player-name">玩家2</span>
      <span class="hand-count">手牌16</span>
    </div>
    <div class="melds-row" style="justify-content: flex-end;">
      <div class="meld-group">
        <div class="card-meld black">佳</div>
        <div class="card-meld black">作</div>
        <div class="card-meld black">亡</div>
      </div>
    </div>
    <div class="hand-folded" style="justify-content: flex-end;">
      <div class="fold-group">
        <div class="card-fold red">福</div>
        <div class="card-fold red">禄</div>
        <div class="card-fold red">寿</div>
      </div>
      <div class="fold-group">
        <div class="card-fold black">乙</div>
        <div class="card-fold black">己</div>
      </div>
    </div>
    <div class="discards-row" style="justify-content: flex-end;">
      <div class="card-discard red">人</div>
      <div class="card-discard green">化</div>
      <div class="card-discard black">尔</div>
    </div>
  </div>

  <!-- 中间区域 -->
  <div class="center-area">
    <span class="status-text">我 出牌 - 15/68</span>
  </div>

  <!-- 底部 - 我(主视角) -->
  <div class="player-area player-bottom main-view">
    <div class="player-header">
      <span class="player-name">我</span>
      <span class="piao-badge">飘1</span>
      <span class="hand-count">手牌19</span>
    </div>
    <div class="melds-row">
      <div class="meld-group">
        <div class="card-meld green">化</div>
        <div class="card-meld green">三</div>
        <div class="card-meld green">千</div>
      </div>
      <div class="meld-group">
        <div class="card-meld black">尔</div>
        <div class="card-meld black">小</div>
        <div class="card-meld black">生</div>
      </div>
    </div>
    <div class="hand-main">
      <div class="card-main red">上</div>
      <div class="card-main red">大</div>
      <div class="card-main red">人</div>
      <div class="card-main green">七</div>
      <div class="card-main green">十</div>
      <div class="card-main green">土</div>
      <div class="card-main black">丘</div>
      <div class="card-main black">乙</div>
      <div class="card-main black">己</div>
      <div class="card-main black">八</div>
      <div class="card-main black">九</div>
      <div class="card-main black">子</div>
      <div class="card-main black">佳</div>
    </div>
    <div class="discards-row">
      <div class="card-discard black">作</div>
      <div class="card-discard black">亡</div>
      <div class="card-discard green">千</div>
    </div>
  </div>

  <!-- 右下角控制栏 - 两排 -->
  <div class="controls">
    <div class="ctrl-row">
      <div class="ctrl-btn play" onclick="togglePlay()">
        <span id="playIcon">▶</span>
        <span id="playText">播放</span>
      </div>
      <div class="speed-btn active" onclick="setSpeed(1)">1x</div>
      <div class="speed-btn" onclick="setSpeed(2)">2x</div>
      <div class="speed-btn" onclick="setSpeed(3)">3x</div>
      <div class="ctrl-btn stop">■ 结束</div>
    </div>
    <div class="ctrl-row">
      <div class="view-btn" onclick="switchView(0)">玩家1</div>
      <div class="view-btn active" onclick="switchView(1)">我</div>
      <div class="view-btn" onclick="switchView(2)">玩家2</div>
      <div class="badge badge-round">第3局</div>
      <div class="badge badge-replay">回放模式</div>
    </div>
  </div>
</div>

<script>
let playing = false;
let currentSpeed = 1;
let currentView = 1;

function togglePlay() {
  playing = !playing;
  document.getElementById('playIcon').textContent = playing ? '⏸' : '▶';
  document.getElementById('playText').textContent = playing ? '暂停' : '播放';
}

function setSpeed(s) {
  currentSpeed = s;
  document.querySelectorAll('.speed-btn').forEach((el, i) => {
    el.classList.toggle('active', [1,2,3][i] === s);
  });
}

function switchView(v) {
  currentView = v;
  document.querySelectorAll('.view-btn').forEach((el, i) => {
    el.classList.toggle('active', i === v);
  });
  // 视角切换逻辑提示
  const names = ['玩家1', '我', '玩家2'];
  alert('切换到' + names[v] + '主视角');
}
</script>
</body>
</html>
